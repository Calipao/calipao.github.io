theme: jekyll-theme-hacker
title: Lin Xin's homepage
description: Portfolio website!   # TODO: replace with a one-line pitch
url: "https://calipao.github.io"
lang: en-US

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - OUTLINE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
